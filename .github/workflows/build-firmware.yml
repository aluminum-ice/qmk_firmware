name: Build QMK firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: ghcr.io/qmk/qmk_cli

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: preonic-rev3-drop
            keyboard: preonic/rev3_drop
          - name: planck-rev7
            keyboard: planck/rev7
          - name: gmmk-pro-ansi
            keyboard: gmmk/pro/ansi

    steps:
      - name: Configure Git
        run: git config --global --add safe.directory '*'

      - name: Check out QMK fork
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Compile firmware
        run: qmk compile -kb "${{ matrix.keyboard }}" -km aluminum-ice

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-aluminum-ice
          path: |
            *.bin
            *.hex
            *.uf2
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest

    # Publish releases for pushed firmware-* tags and for manual runs.
    # A manual run tags the commit it built as firmware-YYYY-MM-DD
    # (Pacific time), adding .2, .3, ... if that tag already exists.
    if: >-
      startsWith(github.ref, 'refs/tags/firmware-') ||
      github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="firmware-$(TZ=America/Los_Angeles date +%F)"
          tag="${base}"
          n=1
          while gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; do
            n=$((n + 1))
            tag="${base}.${n}"
          done

          # Tags created with GITHUB_TOKEN do not trigger another workflow
          # run, so this does not cause a second build.
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" \
            -f sha="${GITHUB_SHA}" >/dev/null

          echo "Created tag ${tag} at ${GITHUB_SHA}"
          echo "name=${tag}" >> "$GITHUB_OUTPUT"

      - name: Download firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-aluminum-ice"
          path: firmware
          merge-multiple: true

      - name: Create checksums
        working-directory: firmware
        run: sha256sum * > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh release create "${TAG}" \
            firmware/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "QMK Firmware ${TAG}"
