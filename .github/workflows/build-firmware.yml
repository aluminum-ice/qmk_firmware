name: Build QMK firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: ghcr.io/qmk/qmk_cli

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: preonic-rev3-drop
            keyboard: preonic/rev3_drop
          - name: planck-rev7
            keyboard: planck/rev7
          - name: gmmk-pro-ansi
            keyboard: gmmk/pro/ansi

    steps:
      - name: Configure Git
        run: git config --global --add safe.directory '*'

      - name: Check out QMK fork
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Compile firmware
        run: qmk compile -kb "${{ matrix.keyboard }}" -km aluminum-ice

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-aluminum-ice
          path: |
            *.bin
            *.hex
            *.uf2
          if-no-files-found: error
